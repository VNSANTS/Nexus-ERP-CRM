name: Backend integrity
on:
  pull_request:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend-validation.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify Cloudflare and GitHub browser origins are isolated
        run: deno test supabase/tests/cors.test.ts
      - name: Typecheck all Supabase Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: nexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NEXUS_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - run: python supabase/tests/integrity.py
