name: Backend integrity
on:
  pull_request:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend-validation.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: nexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NEXUS_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - run: python supabase/tests/integrity.py
