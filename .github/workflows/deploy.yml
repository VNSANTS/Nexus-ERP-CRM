name: Deploy Nexus-ERP-CRM to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/cantinas-nexus/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/cantinas-nexus/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instala pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instala Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Verifica tipos TypeScript
        run: pnpm --filter @workspace/cantinas-nexus run typecheck

      - name: Testa isolamento e atualização do carrinho
        run: node --test artifacts/cantinas-nexus/tests/*.test.mjs

      - name: Valida cardápios e painel com dados fictícios
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: test-only
        run: |
          python -m venv "$RUNNER_TEMP/nexus-qa"
          "$RUNNER_TEMP/nexus-qa/bin/pip" install playwright==1.56.0
          pnpm --filter @workspace/cantinas-nexus run build
          "$RUNNER_TEMP/nexus-qa/bin/python" artifacts/cantinas-nexus/tests/menu-smoke.py

      - name: Guarda capturas dos seis modelos
        uses: actions/upload-artifact@v4
        with:
          name: menu-screens
          path: menu-screens/

      - name: Build do frontend (cantinas-nexus)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          BASE_PATH: /Nexus-ERP-CRM/
        run: pnpm --filter @workspace/cantinas-nexus run build

      - name: Prepara artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/cantinas-nexus/dist/public

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4