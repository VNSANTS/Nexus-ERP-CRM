name: Deploy Nexus-ERP-CRM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/cantinas-nexus/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instala pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instala Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Build do frontend (cantinas-nexus)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          BASE_PATH: /Nexus-ERP-CRM/
        run: pnpm --filter @workspace/cantinas-nexus run build

      - name: Prepara artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/cantinas-nexus/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4