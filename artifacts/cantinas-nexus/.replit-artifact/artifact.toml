kind = "web"
previewPath = "/"
title = "Cantinas Nexus"
version = "1.0.0"
id = "artifacts/cantinas-nexus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19986

[services.development]
run = "pnpm --filter @workspace/cantinas-nexus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cantinas-nexus", "run", "build" ]
serve = "static"
publicDir = "artifacts/cantinas-nexus/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19986"
BASE_PATH = "/"
