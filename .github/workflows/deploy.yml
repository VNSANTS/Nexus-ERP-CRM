name: Deploy Nexus-ERP-CRM to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/cantinas-nexus/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/cantinas-nexus/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instala pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instala Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Verifica tipos TypeScript
        run: pnpm --filter @workspace/cantinas-nexus run typecheck

      - name: Testa isolamento e atualização do carrinho
        run: node --test artifacts/cantinas-nexus/tests/*.test.mjs

      - name: Valida cardápios e painel com dados fictícios
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: test-only
        run: |
          python -m venv "$RUNNER_TEMP/nexus-qa"
          "$RUNNER_TEMP/nexus-qa/bin/pip" install playwright==1.56.0
          pnpm --filter @workspace/cantinas-nexus run build
          "$RUNNER_TEMP/nexus-qa/bin/python" artifacts/cantinas-nexus/tests/menu-smoke.py

      - name: Guarda capturas dos seis modelos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-screens
          path: menu-screens/

      - name: Build isolado para PR (sem variáveis reais)
        if: github.event_name == 'pull_request'
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: test-only
          BASE_PATH: /Nexus-ERP-CRM/
        run: pnpm --filter @workspace/cantinas-nexus run build

      - name: Build de publicação (somente main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          BASE_PATH: /Nexus-ERP-CRM/
        run: pnpm --filter @workspace/cantinas-nexus run build

      - name: Prepara artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/cantinas-nexus/dist/public

  webkit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ['iPhone 13', 'iPad Pro 11']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compila o frontend isolado
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: test-only
        run: pnpm --filter @workspace/cantinas-nexus run build
      - name: Valida fluxo essencial no WebKit
        env:
          ESSENTIAL_ONLY: '1'
          BROWSER_ENGINE: webkit
          TEST_DEVICE: ${{ matrix.device }}
        run: |
          python -m venv "$RUNNER_TEMP/nexus-webkit"
          "$RUNNER_TEMP/nexus-webkit/bin/pip" install playwright==1.56.0
          "$RUNNER_TEMP/nexus-webkit/bin/playwright" install --with-deps webkit
          "$RUNNER_TEMP/nexus-webkit/bin/python" artifacts/cantinas-nexus/tests/menu-smoke.py

  deploy:
    # The frontend requires migration 20261106184508 and compatible Edge Functions.
    # Do not publish on merge until production backup, migration and functions are verified.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: [build, webkit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Testa o site publicado interceptando pedidos e chamadas do painel
        env:
          CHECK_PUBLISHED: '1'
        run: |
          python -m venv "$RUNNER_TEMP/nexus-qa"
          "$RUNNER_TEMP/nexus-qa/bin/pip" install playwright==1.56.0
          "$RUNNER_TEMP/nexus-qa/bin/python" artifacts/cantinas-nexus/tests/menu-smoke.py
